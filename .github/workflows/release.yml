name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for changelog
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ --cov=scripts --cov-report=term
    
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## SRA Accession Search v${{ steps.get_version.outputs.VERSION }}
          
          ### Features
          - Search NCBI SRA for bacterial paired-end Illumina WGS data
          - Filter by coverage (50-250x)
          - Support for 6 bacterial genera: Salmonella, E. coli, Listeria, Campylobacter, Staphylococcus, Streptococcus
          
          ### Installation
          ```bash
          pip install -r requirements.txt
          ```
          
          See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for usage instructions.
        draft: false
        prerelease: false
